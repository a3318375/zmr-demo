# Tomcat
server: 
  port: 50001

# Spring
spring: 
  application:
    # 应用名称
    name: zmr-auth
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 192.168.0.3:8848
        # 命名空间
        namespace: f0dab304-9ecd-4b8f-986d-81e7ed6b624e
      config:
        # 命名空间
        namespace: f0dab304-9ecd-4b8f-986d-81e7ed6b624e
        # 配置中心地址
        server-addr: 192.168.0.3:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application.${spring.cloud.nacos.config.file-extension}