workflow:
  rules:
   - if: $CI_COMMIT_MESSAGE =~ /^cicd/
    # - if: $CI_COMMIT_TAG
#only:
#  - if: $CI_COMMIT_MESSAGE = ~ /^[Release] .*$/
stages:          # List of stages for jobs, and their order of execution
  - 编译
  - deploy



build-job:       # This job runs in the build stage, which runs first.
  stage: 编译
  script:
    - mvn clean
    - mvn install
    - cd output
    - rm -rf /www/java/zmr-os/ea/os-ea.jar
    - cp os-ea.jar /www/java/zmr-os/ea/
    - docker restart os-ea
    - rm -rf /www/java/zmr-os/rs/os-rs.jar
    - cp os-rs.jar /www/java/zmr-os/rs/
    - docker restart os-rs

deploy-job:      # This job runs in the deploy stage.
  stage: deploy  # It only runs when *both* jobs in the test stage complete successfully.
  environment: production
  script:
    - ps -ef | grep os-cms.jar | grep -v grep
